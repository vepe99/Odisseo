# This section describes the requirements of the build/installation
# process itself. Being able to do this was the original reason to
# introduce pyproject.toml
[build-system]
requires = [
    "setuptools >=61",
]
build-backend = "setuptools.build_meta"


[project]
name = "odisseo"
version = "0.1.0"
description = "differentiable N-body simulator"
authors = [{ name = "Giuseppe Viterbo" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

# Upper bound: jax 0.12 miscompiles the snapshot integration loop. A
# data-dependent lax.cond in the loop body combined with the nested vmap in
# direct_acc / direct_acc_laxmap silently corrupts the while_loop carry, so
# simulations diverge instead of failing. Correct through 0.11.
dependencies = [
    "sphinx-autodoc2",
    "autocvd",
    "diffrax >= 0.7.0",
    "jax >= 0.6.1, < 0.12",
    "scipy >= 1.0.0",
    "astropy >= 6.0.0",
    "numpy >= 1.0.0",
    "matplotlib >= 3.9.0",
    "beartype >= 0.19.0",
    "ipykernel",
]

[project.optional-dependencies]
# GPU backends. The base `jax` requirement installs the CPU build. On a machine
# with NVIDIA GPUs, sync the extra matching the CUDA major version of the
# driver. These wheels are published for Linux only.
cuda12 = [
    "jax[cuda12] >= 0.6.1, < 0.12",
]

cuda13 = [
    "jax[cuda13] >= 0.6.1, < 0.12",
]

tests = [
    "pytest",
    "pytest-cov",
    "nbval",
]

docs = [
    "sphinx",
    "sphinxcontrib-apidoc",
    "myst_nb",
    "sphinx_copybutton", 
    "sphinx_design",
    "sphinx_book_theme",
    "sphinx_mdinclude",
    "sphinx_rtd_theme",
    "sphinx-autodoc2",
    "furo",
]

[tool.uv]
# Only one CUDA backend can be installed at a time.
conflicts = [
    [{ extra = "cuda12" }, { extra = "cuda13" }],
]

[tool.setuptools]
packages = [
    "odisseo",
]